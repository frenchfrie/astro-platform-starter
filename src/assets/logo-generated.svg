<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">

    <!-- Background -->
    <rect x="0" y="0" width="400" height="500" fill="white"/>

    <g transform="translate(0,0)">
        <!-- Medaillon -->
        <circle cx="200" cy="200" r="160" fill="none" stroke="black" stroke-width="4"/>
        <circle cx="200" cy="200" r="150" fill="none" stroke="black" stroke-width="1"/>

        <!-- Textes medaillon -->
        <defs>
            <path id="topArcPath" d="M 17,220 A 160,162 0 0,1 385,220" fill="none"/>
        </defs>

        <text font-family="Adorn Copperplate, classic-serif, serif" font-size="32" fill="black" text-rendering="geometricPrecision">
            <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">Château de Feydoux</textPath>
        </text>

        <g transform="translate(200,200)">
            <!-- Dessin chateau -->

            <!-- corps -->
            <rect x="-50" y="-30" width="100" height="140" fill="none" stroke="black" stroke-width="1"/>
            <line x1="50" y1="30" x2="146" y2="30" stroke="black" stroke-width="1"/>
            <line x1="50" y1="110" x2="101" y2="110" stroke="black" stroke-width="1"/>

            <!-- toit -->
            <polygon points="-55,-35 55,-35 20,-100 -20,-100" fill="none" stroke="black" stroke-width="1"/>
            <polygon points="-50,-30 -55,-35 55,-35 50,-30" stroke="black" fill="none" stroke-width="1"/>

            <!-- antennes -->
            <line x1="-20" y1="-100" x2="-20" y2="-115" stroke="black" stroke-width="1"/>
            <line x1="20" y1="-100" x2="20" y2="-115" stroke="black" stroke-width="1"/>

            <!-- corniche facade -->
            <line x1="-50" y1="50" x2="50" y2="50" stroke="black" stroke-width="1"/>

            <!-- fenetre -->
            <g transform="translate(0,20)">
                <rect x="-10" y="-30" width="20" height="40" fill="none" stroke="black" stroke-width="2"/>
                <line x1="0" y1="-30" x2="0" y2="10" stroke="black" stroke-width="1"/>
                <line x1="-10" y1="-20" x2="10" y2="-20" stroke="black" stroke-width="1"/>
                <line x1="-10" y1="0" x2="10" y2="0" stroke="black" stroke-width="1"/>
                <rect x="-20" y="10" width="40" height="6" fill="none" stroke="black" stroke-width="1"/>
                <polygon points="-15,-30 -20,-35 20,-35 15,-30" stroke="black" fill="none" stroke-width="1"/>
            </g>

            <!-- porte -->
            <rect x="-10" y="70" width="20" height="40" fill="none" stroke="black" stroke-width="1"/>
            <polygon points="-15,70 -20,65 20,65 15,70" stroke="black" fill="none" stroke-width="1"/>

        </g>
    </g>

    <g transform="translate(200, 390)">
        <!-- Textes du bas -->
        <text x="0" y="0" text-anchor="middle" font-family="Adorn Copperplate, classic-serif, serif" font-size="26" fill="black">Ab anno MDCL</text>
        <text x="0" y="44" text-anchor="middle" font-family="Adorn Copperplate, classic-serif, serif" font-size="44" fill="black">Fidelis tamen</text>
    </g>
</svg>
